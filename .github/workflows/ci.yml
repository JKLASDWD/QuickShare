name: Source validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          node --check server/token-service/server.mjs
          node --check client/main.js
          node --check client/certificate-policy.js
          node --check client/preload.js
          node --check client/diagnostics.js
          node --check client/process-audio.js
          node --check client/room-id.js
          node --check client/renderer/room-chat.js
          node --check client/renderer/process-audio-worklet.js
          node --check client/scripts/build-native.mjs
          node --check client/scripts/verify-package.cjs
          node --check client/scripts/vendor-licenses.mjs
