# LiveKit 服务端配置（生产部署前必改 keys；TURN/TLS 另需域名和证书）
port: 7880

rtc:
  tcp_port: 7881 # 媒体 TCP 回退
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true # VPS 公网部署必开

# TURN：UDP 3478 兜底 NAT 穿透。
# TURN/TLS 需额外配置域名、证书/私钥及端口/四层入口；LiveKit 不会自动申请证书。
# 当前 Caddy 占用 TCP 443，不能仅取消下面的注释；详见 docs/服务端部署指南.md。
turn:
  enabled: true
  udp_port: 3478
  # domain: share.example.com
  # tls_port: 5349

keys:
  # 生产必改：生成方式 `openssl rand -hex 32`，需与 docker-compose.yml 中 token 服务环境变量一致
  devkey: secret
