# IP 明文部署：仅用于可信内网/VPN；配置步骤见 docs/服务端部署指南.md。
# docker compose -p quickshare -f docker-compose.ip.yml up -d --build
services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${LIVEKIT_CONFIG:-./livekit.yaml}:/etc/livekit.yaml:ro

  token:
    build: ../server/token-service
    restart: unless-stopped
    network_mode: host # 与 livekit 同 host 网络，127.0.0.1:7880 直通
    environment:
      LISTEN: 0.0.0.0:8080
      LIVEKIT_HTTP_URL: http://127.0.0.1:7880
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:-ws://${SERVER_IP:?Set SERVER_IP in .env}:7880}
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
      AUTH_TOKEN: ${AUTH_TOKEN:?Set AUTH_TOKEN in .env}
      REQUIRE_AUTH: "1" # IP 直连强制鉴权：API 全接口（除 /api/health）需 Bearer
