# IP 直连部署（无域名 / 无 TLS）：适合内网或临时公网 IP 使用
# 用法：
#   1) 改 livekit.yaml 的 keys（openssl rand -hex 32），形如 devkey: <hex32>
#   2) 生成访问令牌：openssl rand -hex 16 → AUTH_TOKEN（必填，缺失则服务拒绝启动）
#   3) 启动：
#      export LIVEKIT_API_SECRET=<上面 hex32> AUTH_TOKEN=<hex16> SERVER_IP=1.2.3.4
#      docker-compose -f docker-compose.ip.yml up -d --build
#   4) 防火墙放行：8080/tcp（Token API）7880/tcp（信令）7881/tcp 3478/udp（TURN）50000-60000/udp（媒体）
#   5) 客户端「设置」：服务器地址 http://<SERVER_IP>:8080；访问令牌填 AUTH_TOKEN（全员同一把对等密钥）
#
# 安全模型：AUTH_TOKEN 为客户端/服务端共享的对等密钥——列表/建房/进房/删房全部需 Bearer；
# 无令牌者拿不到 LiveKit token，接触不到媒体面。媒体流恒为 SRTP 加密；明文仅为信令/API 载荷。
# 公网长期正式使用建议走域名 + TLS 的 docker-compose.yml（Caddy 自动 HTTPS）。
services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  token:
    build: ../server/token-service
    restart: unless-stopped
    network_mode: host # 与 livekit 同 host 网络，127.0.0.1:7880 直通
    environment:
      LISTEN: 0.0.0.0:8080
      LIVEKIT_HTTP_URL: http://127.0.0.1:7880
      LIVEKIT_WS_URL: ws://${SERVER_IP}:7880 # 客户端据此建 WebRTC 连接
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      AUTH_TOKEN: ${AUTH_TOKEN} # 必填：REQUIRE_AUTH=1 时缺失拒绝启动
      REQUIRE_AUTH: "1" # IP 直连强制鉴权：API 全接口（除 /api/health）需 Bearer
