# 屏幕共享服务端：先按 docs/服务端部署指南.md 创建本地配置
#   docker compose -p quickshare up -d --build
# 防火墙放行：80,443/tcp(caddy) 7881/tcp(媒体TCP) 3478/udp(TURN) 50000-60000/udp(媒体UDP)
services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit/livekit.yaml
    # host 网络：WebRTC UDP 端口段无需逐个映射（Linux VPS）
    network_mode: host
    volumes:
      - ${LIVEKIT_CONFIG:-./livekit.yaml}:/etc/livekit/livekit.yaml:ro

  token:
    build: ../server/token-service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LISTEN: 0.0.0.0:8080
      # livekit 在 host 网络，容器内经 host-gateway 访问
      LIVEKIT_HTTP_URL: http://host.docker.internal:7880
      # 下发给客户端的信令地址（wss 走 caddy 443）
      LIVEKIT_WS_URL: wss://${SHARE_DOMAIN:?Set SHARE_DOMAIN in .env}
      LIVEKIT_API_KEY: devkey # 与本地 LiveKit 配置的 keys 名称一致
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
      AUTH_TOKEN: ${AUTH_TOKEN:?Set AUTH_TOKEN in .env}
      REQUIRE_AUTH: "1"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SHARE_DOMAIN: ${SHARE_DOMAIN:?Set SHARE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
