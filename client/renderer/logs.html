<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>诊断日志</title>
<style>body{margin:16px;background:#151923;color:#e8ecf4;font:14px "Segoe UI","Microsoft YaHei",sans-serif}header{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{background:#253146;color:#fff;border:1px solid #40516b;border-radius:6px;padding:8px;cursor:pointer}#path{font-size:12px;overflow-wrap:anywhere;color:#9eb9df}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#10151f;padding:12px;border-radius:8px;height:calc(100vh - 150px);overflow:auto;font:12px/1.6 Consolas,monospace}</style>
<header><b>诊断日志</b><button id="refresh">刷新</button><button id="copy">复制日志</button><button id="folder">打开所在文件夹</button><label><input type="checkbox" id="auto" checked>自动刷新</label><span id="status"></span></header><p id="path"></p><pre id="content"></pre>
<script>
async function refresh(){try{const data=await window.bridge.getLogs();if(!data)return;const content=document.getElementById('content'),bottom=content.scrollHeight-content.scrollTop-content.clientHeight<50;document.getElementById('path').textContent=data.path;content.textContent=data.text;if(bottom)content.scrollTop=content.scrollHeight;}catch(e){document.getElementById('status').textContent=e.message;}}
document.getElementById('refresh').onclick=refresh;document.getElementById('folder').onclick=()=>window.bridge.openLogFolder();document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('content').textContent);document.getElementById('status').textContent='已复制';}catch{document.getElementById('status').textContent='复制失败，可手动选择日志文本';}};refresh();setInterval(()=>{if(document.getElementById('auto').checked)refresh();},3000);
</script></html>
