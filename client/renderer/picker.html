<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>共享屏幕</title>
<style>
  :root { --bg:#151923; --panel:#1d2330; --line:#2c3446; --txt:#e8ecf4; --dim:#8b94a7; --acc:#3d9eff; --ok:#3ecf8e; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; user-select:none; }
  header { padding:14px 18px 6px; display:flex; align-items:baseline; gap:10px; }
  header h1 { font-size:17px; margin:0; }
  header .hint { color:var(--dim); font-size:12px; }
  main { padding:0 18px 18px; }
  h2 { font-size:12px; color:var(--dim); margin:14px 0 8px; font-weight:600; letter-spacing:.05em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; max-height:38vh; overflow:auto; padding:2px; }
  .card { background:var(--panel); border:2px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer; transition:border-color .12s, transform .12s; }
  .card:hover { border-color:#41506b; }
  .card.selected { border-color:var(--acc); box-shadow:0 0 0 3px rgba(61,158,255,.2); }
  .card img.thumb { width:100%; height:112px; object-fit:cover; display:block; background:#0d1017; }
  .card .cap { display:flex; align-items:center; gap:6px; padding:6px 8px; font-size:12px; color:var(--dim); }
  .card .cap img { width:16px; height:16px; }
  .card .cap span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  form { margin-top:14px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .field { flex:1; min-width:160px; }
  label { display:block; font-size:12px; color:var(--dim); margin-bottom:4px; }
  input[type=text],input[type=password] { width:100%; background:#12161f; border:1px solid var(--line); color:var(--txt); border-radius:6px; padding:8px 10px; font-size:14px; }
  input:focus { outline:none; border-color:var(--acc); }
  .actions { margin-top:14px; display:flex; align-items:center; gap:12px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:10px 22px; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--dim); }
  .err { color:var(--err); font-size:14px; min-height:18px; flex:1; font-weight:600; }
  .grid.empty::after { content:'未发现可用屏幕/窗口'; display:block; color:var(--dim); padding:18px 4px; font-size:13px; }
  /* 共享中视图 */
  #liveView { display:none; text-align:center; padding:36px 20px; }
  #liveView .dot { width:12px; height:12px; border-radius:50%; background:var(--ok); display:inline-block; margin-right:8px; animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.4; } }
  #liveView .room { font-size:34px; font-weight:700; margin:14px 0 4px; letter-spacing:.04em; }
  #liveView .sub { color:var(--dim); margin-bottom:22px; }
</style>
</head>
<body>
  <header><h1>共享屏幕</h1><span class="hint" id="hint">正在枚举屏幕与窗口…</span><button class="ghost" id="watchBtn" style="margin-left:auto">查看共享 →</button></header>
  <main>
    <div id="pickView">
      <h2>屏幕</h2><div class="grid" id="screens"></div>
      <h2>窗口</h2><div class="grid" id="windows"></div>
      <form autocomplete="off" onsubmit="return false">
        <div class="row">
          <div class="field"><label>房间号（同事凭此号观看）</label><input id="roomId" type="text" placeholder="如 210" maxlength="32" /></div>
          <div class="field" style="max-width:180px"><label>口令（可选）</label><input id="password" type="password" placeholder="留空不设口令" maxlength="64" /></div>
        </div>
        <div class="actions">
          <button type="button" id="startBtn" disabled>开始共享</button>
          <button type="button" class="ghost" id="sysPickBtn" title="列表加载不出时，用 Windows 系统弹窗选择共享内容">系统选择器共享…</button>
          <div class="err" id="err"></div>
        </div>
      </form>
    </div>
    <div id="liveView">
      <div><span class="dot"></span>正在共享</div>
      <div class="room" id="liveRoom"></div>
      <div class="sub">同事打开客户端，在房间列表点击「<span id="liveRoom2"></span>」即可观看 · 已共享 <span id="elapsed">0:00</span></div>
      <button type="button" class="ghost" id="stopBtn">停止共享</button>
    </div>
  </main>
<script src="vendor/livekit-client.js"></script>
<script>
'use strict';
(() => {
const LK = window.LivekitClient;
const bridge = window.bridge || {
  getConfig: async () => ({ server: new URLSearchParams(location.search).get('server') || 'http://localhost:8080', displayName: '浏览器测试', defaultRoomId: '', maxBitrateKbps: 4000, configPath: '(browser)' }),
  listSources: async () => [],
  notify: () => {}, log: () => {},
  onPickerShown: () => {}, onStopShare: () => {},
  shareStarted: () => {}, shareStopped: () => {},
};
const $ = (id) => document.getElementById(id);
let cfg = null, selected = null, timer = null, startedAt = 0, sharing = false;
let active = null, starting = false, startTask = null, stopTask = null;
const IS_ELECTRON = !!(window.bridge && window.bridge.openViewer); // shim 无 openViewer，可判别 preload 是否加载

function fatal(msg) {
  const el = $('err');
  if (el) el.textContent = msg;
  const hint = $('hint');
  if (hint) hint.textContent = '发生错误，请把红字发给开发者';
  console.error(msg);
  bridge.log?.(`[picker-fatal] ${msg}`);
}
window.addEventListener('error', (e) => fatal(`脚本错误：${e.message} @${(e.filename || '').split('/').pop()}:${e.lineno}`));
window.addEventListener('unhandledrejection', (e) => fatal(`未捕获异常：${e.reason?.message || e.reason}`));

init();
async function init() {
  try {
    const t0 = Date.now();
    cfg = await bridge.getConfig();
    bridge.onConfigChanged?.((next) => { cfg = next; });
    bridge.log?.(`init server=${cfg.server} electron=${IS_ELECTRON} ${Date.now() - t0}ms`);
    if (!IS_ELECTRON) console.warn('运行在浏览器降级模式：preload 未加载');
    $('roomId').value = cfg.defaultRoomId || genRoomId();
    refreshSources();
    $('startBtn').onclick = startShare;
    $('sysPickBtn').onclick = startShareViaSystemPicker;
    $('watchBtn').onclick = () => {
      if (!bridge.openViewer) return fatal('查看共享不可用：桥接未加载（preload 失效），请把此红字截图反馈');
      bridge.openViewer();
    };
    $('stopBtn').onclick = stopShare;
    $('roomId').oninput = updateStartBtn;
    document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !sharing) startShare(); });
    bridge.onPickerShown(() => { if (!sharing) refreshSources(); });
    bridge.onStopShare(() => stopShare());
  } catch (e) {
    fatal(`初始化失败：${e.message || e}（配置读取中断）`);
  }
}

let refreshSeq = 0;
async function refreshSources() {
  const my = ++refreshSeq; // 过期响应丢弃；页面初始化与 picker-shown 双触发只留一次
  const t0 = Date.now();
  bridge.log?.(`refresh-sources #${my}`);
  $('hint').textContent = '正在枚举屏幕…';
  try {
    const screens = (await bridge.listSources(['screen'])).filter((s) => s.kind === 'screen');
    if (my !== refreshSeq) return;
    render($('screens'), screens);
    bridge.log?.(`screens ok ${screens.length} 项 ${Date.now() - t0}ms`);
    $('hint').textContent = '屏幕已就绪，正在枚举窗口…（窗口较多时稍慢，可先双击屏幕缩略图共享）';
  } catch (err) {
    if (my !== refreshSeq) return;
    $('err').textContent = `枚举屏幕失败：${err.message || err}`;
    $('hint').textContent = '可点「系统选择器共享…」直接共享';
    return;
  }
  try {
    const wins = (await bridge.listSources(['window'])).filter((s) => s.kind === 'window' && !s.name.includes('ScreenShare'));
    if (my !== refreshSeq) return;
    render($('windows'), wins);
    bridge.log?.(`windows ok ${wins.length} 项 ${Date.now() - t0}ms`);
    $('hint').textContent = '单击选择，双击缩略图直接开始共享';
  } catch (err) {
    if (my !== refreshSeq) return;
    $('hint').textContent = '窗口列表加载失败（不影响屏幕共享）';
  }
}
function genRoomId() { return String(100 + Math.floor(Math.random() * 900)); }
function render(box, list) {
  box.innerHTML = '';
  for (const s of list) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<img class="thumb" src="${s.thumbnail}" alt="" />
      <div class="cap">${s.icon ? `<img src="${s.icon}" alt="" />` : ''}<span title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</span></div>`;
    card.onclick = () => {
      selected = s;
      document.querySelectorAll('.card').forEach((c) => c.classList.remove('selected'));
      card.classList.add('selected');
      if (!$('roomId').value.trim()) $('roomId').value = genRoomId();
      $('hint').textContent = `已选择「${s.name}」，双击缩略图或点「开始共享」`;
      updateStartBtn();
    };
    card.ondblclick = () => { selected = s; if (!$('roomId').value.trim()) $('roomId').value = genRoomId(); startShare(); };
    box.appendChild(card);
  }
}
function updateStartBtn() {
  $('startBtn').disabled = !(selected && !sharing && !starting && !stopTask);
  $('sysPickBtn').disabled = sharing || starting || !!stopTask;
}

function startShare() { if (selected) return beginShare(false); }
function startShareViaSystemPicker() { return beginShare(true); }
function beginShare(systemPicker) {
  if (sharing || starting || stopTask) return;
  starting = true;
  const s = active = { cancelled: false, raw: null, room: null, track: null, created: null };
  const source = selected;
  const roomId = $('roomId').value.trim() || genRoomId();
  const password = $('password').value;
  $('roomId').value = roomId;
  $('err').textContent = '';
  updateStartBtn();
  bridge.shareBusy?.();
  startTask = runShare(s, source, systemPicker, roomId, password).finally(() => {
    starting = false;
    startTask = null;
    updateStartBtn();
  });
  return startTask;
}

function checkCancelled(s) { if (s.cancelled) throw new Error('共享已取消'); }
async function runShare(s, source, systemPicker, roomId, password) {
  let watchdog;
  try {
    // 每次操作读最新配置，并固定本次会话的服务地址/令牌用于回滚。
    s.cfg = await bridge.getConfig();
    checkCancelled(s);
    const capture = (systemPicker
      ? navigator.mediaDevices.getDisplayMedia({ audio: false, video: { frameRate: { ideal: 30, max: 30 } } })
      : navigator.mediaDevices.getUserMedia({ audio: false,
          video: { mandatory: { chromeMediaSource: 'desktop', chromeMediaSourceId: source.id, maxFrameRate: 30 } } }))
      .then((ms) => {
        if (s.cancelled) { ms.getTracks().forEach((t) => t.stop()); throw new Error('共享已取消'); }
        return ms;
      });
    const ms = await Promise.race([capture, new Promise((_, reject) => {
      watchdog = setTimeout(() => { s.cancelled = true; reject(new Error('采集选择超时，请重试')); }, systemPicker ? 60000 : 15000);
    })]);
    clearTimeout(watchdog);
    s.raw = ms.getVideoTracks()[0];
    if (!s.raw) throw new Error('没有可用的视频轨道');
    s.raw.addEventListener('ended', () => { if (active === s && !s.cancelled) finish({}); });
    checkCancelled(s);
    const presenter = s.cfg.displayName;
    const res = await fetch(`${s.cfg.server}/api/rooms`, {
      signal: AbortSignal.timeout(10000),
      method: 'POST',
      headers: apiHeaders(s.cfg),
      body: JSON.stringify({ roomId, presenter, password: password || undefined }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error((data.error || `建房失败 ${res.status}`) + (res.status === 409 ? '（若是你刚停止的房间，稍候几秒重试或换个号）' : ''));

    s.created = { roomId, ownerToken: data.ownerToken };
    checkCancelled(s);
    s.room = new LK.Room({ adaptiveStream: true, dynacast: true });
    s.room.on(LK.RoomEvent.Disconnected, () => {
      if (active === s && !s.cancelled) finish({ error: '连接已断开' });
    });
    await s.room.connect(data.url, data.token);
    checkCancelled(s);
    s.track = new LK.LocalVideoTrack(s.raw);
    s.track.mediaStreamTrack.contentHint = 'detail';
    await s.room.localParticipant.publishTrack(s.track, {
      source: LK.Track.Source.ScreenShare,
      name: source?.name || s.raw.label || '屏幕/窗口',
      simulcast: true,
      degradationPreference: 'maintain-resolution', // 偶发模糊主因：带宽/CPU 紧张时编码器默认降分辨率；屏幕内容改为保分辨率、牺牲帧率
      videoEncoding: { maxBitrate: (s.cfg.maxBitrateKbps || 8000) * 1000, priority: 'high' },
    });
    checkCancelled(s);
    sharing = true;
    startedAt = Date.now();
    $('pickView').style.display = 'none';
    $('liveView').style.display = 'block';
    $('liveRoom').textContent = roomId;
    $('liveRoom2').textContent = roomId;
    timer = setInterval(() => {
      const s = Math.floor((Date.now() - startedAt) / 1000);
      $('elapsed').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }, 1000);
    bridge.shareStarted({ roomId, presenter });
  } catch (err) {
    const msg = err.message || String(err);
    $('err').textContent = `共享失败：${msg}`;
    $('hint').textContent = '单击选择，双击缩略图直接开始共享';
    bridge.notify?.('共享失败', msg);
    await cleanup(s);
    if (active === s) active = null;
    bridge.shareStopped({});
  } finally {
    clearTimeout(watchdog);
  }
}

async function stopShare() { await finish({}); }
function finish(info) {
  if (stopTask) return stopTask;
  const s = active;
  if (s) { s.cancelled = true; try { s.raw?.stop(); } catch {} }
  sharing = false;
  stopTask = (async () => {
    if (startTask) await startTask;
    if (s) await cleanup(s);
    if (active === s) active = null;
    $('pickView').style.display = '';
    $('liveView').style.display = 'none';
    bridge.shareStopped(info || {});
  })().finally(() => { stopTask = null; updateStartBtn(); });
  updateStartBtn();
  return stopTask;
}
function apiHeaders(c) {
  return { 'content-type': 'application/json', ...(c.authToken ? { authorization: `Bearer ${c.authToken}` } : {}) };
}
async function cleanup(s) {
  s.cancelled = true;
  if (timer) { clearInterval(timer); timer = null; }
  try { s.track?.stop(); s.raw?.stop(); } catch {}
  s.track = null; s.raw = null;
  const oldRoom = s.room;
  s.room = null;
  try { await oldRoom?.disconnect(); } catch {}
  const created = s.created;
  s.created = null;
  if (!created) return;
  try {
    const r = await fetch(`${s.cfg.server}/api/rooms/${encodeURIComponent(created.roomId)}`, {
      signal: AbortSignal.timeout(4000), method: 'DELETE', headers: apiHeaders(s.cfg),
      body: JSON.stringify({ ownerToken: created.ownerToken }),
    });
    if (!r.ok && r.status !== 404) throw new Error(`删房失败 ${r.status}`);
    bridge.log?.(`delete-room ok ${created.roomId}`);
  } catch (e) { $('err').textContent = `房间清理失败：${e.message}；服务端稍后自动清理`; bridge.log?.(String(e)); }
}
function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
})();
</script>
</body>
</html>
