<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>查看共享</title>
<link rel="stylesheet" href="room-chat.css">
<style>
  :root { --bg:#151923; --panel:#1d2330; --line:#2c3446; --txt:#e8ecf4; --dim:#8b94a7; --acc:#3d9eff; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex;flex-direction:column; background:var(--bg); color:var(--txt); font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; user-select:none; }
  header { padding:14px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; flex:1; }
  .status { font-size:12px; color:var(--dim); }
  .status.online::before { content:''; display:inline-block; width:8px; height:8px; border-radius:50%; background:#3ecf8e; margin-right:6px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:8px 16px; font-size:13px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--dim); }
  main { padding:0 18px 18px;flex:1;min-height:0;overflow:auto; }
  /* 房间列表 */
  #list { display:flex; flex-direction:column; gap:10px; }
  .room-card { display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 18px; cursor:pointer; transition:border-color .12s; }
  .room-card:hover { border-color:var(--acc); }
  .room-card .no { font-size:22px; font-weight:700; min-width:90px; }
  .room-card .info { flex:1; color:var(--dim); font-size:13px; }
  .room-card .lock { color:#f0b429; }
  .room-card .go { color:var(--acc); font-size:13px; }
  .empty { text-align:center; color:var(--dim); padding:48px 0; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:24px; background:#2a3242; border:1px solid var(--line); border-radius:8px; padding:10px 18px; font-size:13px; display:none; max-width:80%; }
  /* 观看视图 */
  #watch { display:none; height:100%; flex-direction:column; }
  #grid { flex:1; display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); overflow:auto; }
  .cell { position:relative; background:#0d1017; border:1px solid var(--line); border-radius:8px; overflow:hidden; min-height:120px; }
  .cell video { width:100%; height:100%; object-fit:contain; display:block; }
  .cell .tag { position:absolute; left:8px; top:8px; background:rgba(0,0,0,.55); border-radius:5px; padding:2px 8px; font-size:12px; }
  .cell.enlarged { grid-column:1/-1; grid-row:1/-1; }
  .watch-room { display:flex;gap:12px;flex:1;min-height:0; }
  #grid { min-width:0; }
  #roomChat { width:280px;flex-shrink:0;max-height:none; }
  @media(max-width:760px) { .watch-room { flex-direction:column;overflow:auto; } #roomChat { width:auto;min-height:280px; } #grid { min-height:240px; } }
  /* 口令小表单 */
  #pwBox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); align-items:center; justify-content:center; }
  #pwBox .box { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px; width:320px; }
  #pwBox input { width:100%; background:#12161f; border:1px solid var(--line); color:var(--txt); border-radius:6px; padding:8px 10px; margin:8px 0 12px; }
</style>
</head>
<body>
  <header>
    <button class="ghost" id="backBtn" style="display:none">← 返回列表</button>
    <h1 id="title">房间列表</h1>
    <span class="status" id="status">加载中…</span>
    <span id="joinBox" style="display:flex; gap:6px; align-items:center">
      <input id="joinNo" placeholder="房间号直进" maxlength="32" style="width:110px; background:#12161f; border:1px solid var(--line); color:var(--txt); border-radius:6px; padding:6px 8px; font-size:13px;" />
      <button id="joinBtn" class="ghost">进入</button>
    </span>
    <button class="ghost" id="refreshBtn">刷新</button>
    <button class="ghost" id="shareBtn">共享屏幕</button>
    <button class="ghost" id="settingsBtn">设置</button>
    <button class="ghost" id="logsBtn">日志</button>
  </header>
  <main>
    <div id="list"><div class="empty">正在获取房间…</div></div>
    <div id="watch">
      <button class="ghost" id="audioBtn">声音：开启</button>
      <div id="audioContainer"></div>
      <div class="watch-room"><div id="grid"></div><section id="roomChat"></section></div>
    </div>
  </main>
  <div id="pwBox"><div class="box">
    <div>房间 <b id="pwRoom"></b> 需要口令</div>
    <input id="pwInput" type="password" placeholder="输入房间口令" maxlength="64" />
    <div style="display:flex; gap:10px"><button id="pwOk">进入</button><button class="ghost" id="pwCancel">取消</button></div>
  </div></div>
  <div class="toast" id="toast"></div>
<script src="vendor/livekit-client.js"></script>
<script src="room-chat.js"></script>
<script>
'use strict';
(() => {
const LK = window.LivekitClient;
// bridge 兜底：纯浏览器测试时降级（server 从 URL 参数读取）
const bridge = window.bridge || {
  getConfig: async () => ({ server: new URLSearchParams(location.search).get('server') || 'http://localhost:8080', displayName: '浏览器测试', configPath: '(browser)' }),
  onViewerShown: () => {},
};
const $ = (id) => document.getElementById(id);
let cfg = null, room = null, currentRoom = null, refreshTimer = null, pwTarget = null;
const audioTracks = new Map();
let muted = false;
function applyAudioState() {
  for (const {track,element} of audioTracks.values()) {track.setVolume?.(muted?0:1);element.muted=muted;}
  $('audioBtn').textContent=muted?'声音：关闭':'声音：开启';
}
async function startPlayback() {
  const candidate=room;
  try {if(!muted) await candidate?.startAudio?.();if(room===candidate)applyAudioState();}
  catch(error){bridge.log?.('viewer-playback-failed',{error:error.message});if(room===candidate&&!muted)toast('点击“声音：开启”以播放声音');}
}
$('audioBtn').onclick = async () => {muted=!muted;applyAudioState();bridge.log?.('viewer-mute',{muted,tracks:audioTracks.size});if(!muted)await startPlayback();};
let joining = false, joinSeq = 0, listSeq = 0;
let roomChat = null;

init();
async function init() {
  cfg = await bridge.getConfig();
  bridge.onConfigChanged?.((next) => { cfg = next; ++listSeq; if (!room && !joining) loadRooms(); });
  $('refreshBtn').onclick = loadRooms;
  $('shareBtn').onclick = () => bridge.openPicker?.();
  $('settingsBtn').onclick = () => bridge.openSettings?.();
  $('logsBtn').onclick = () => bridge.openLogs?.();
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === ',') { e.preventDefault(); bridge.openSettings?.(); }
  });
  $('backBtn').onclick = leaveRoom;
  $('joinBtn').onclick = () => { const id = $('joinNo').value.trim(); if (id) joinRoom(id); };
  $('joinNo').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('joinBtn').click(); });
  bridge.onViewerShown(() => { if (!room) loadRooms(); });
  loadRooms();
  refreshTimer = setInterval(() => { if (!room) loadRooms(); }, 3000);
}

async function loadRooms() {
  const seq = ++listSeq;
  try {
    const latest = await bridge.getConfig();
    const res = await fetch(`${latest.server}/api/rooms`, { signal: AbortSignal.timeout(10000), headers: latest.authToken ? { authorization: `Bearer ${latest.authToken}` } : {} });
    const data = await res.json();
    if (seq !== listSeq || room || joining) return;
    if (!res.ok) throw new Error(data.error || res.status);
    $('status').textContent = `服务器在线 · ${data.rooms.length} 个房间`;
    $('status').className = 'status online';
    renderList(data.rooms);
  } catch (err) {
    if (seq !== listSeq || room || joining) return;
    $('status').textContent = '服务器不可达';
    $('status').className = 'status';
    $('list').innerHTML = `<div class="empty">无法连接服务器（${escapeHtml(String(err.message || err))}）<br/>请到设置中检查服务器地址</div>`;
  }
}

function renderList(rooms) {
  const box = $('list');
  box.innerHTML = '';
  if (!rooms.length) { box.innerHTML = '<div class="empty">当前没有正在进行的共享<br/>等待有人开始共享后，这里会自动出现房间</div>'; return; }
  for (const r of rooms) {
    const el = document.createElement('div');
    el.className = 'room-card';
    el.innerHTML = `<div class="no">${escapeHtml(r.roomId)}</div>
      <div class="info">${r.hasPassword ? '<span class="lock">🔒 </span>' : ''}${escapeHtml(r.presenter)} · ${r.participants} 人在线 · ${r.publishers} 路画面</div>
      <div class="go">点击观看 ▸</div>`;
    el.onclick = () => (r.hasPassword ? askPassword(r) : joinRoom(r.roomId));
    box.appendChild(el);
  }
}

function askPassword(r) {
  pwTarget = r.roomId;
  $('pwRoom').textContent = r.roomId;
  $('pwInput').value = '';
  $('pwBox').style.display = 'flex';
  $('pwInput').focus();
}
$('pwCancel').onclick = () => ($('pwBox').style.display = 'none');
$('pwOk').onclick = () => { $('pwBox').style.display = 'none'; joinRoom(pwTarget, $('pwInput').value); };
$('pwInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('pwOk').click(); });

async function joinRoom(roomId, password) {
  if (joining || room) return;
  joining = true;
  const seq = ++joinSeq;
  ++listSeq;
  let candidate = null;
  bridge.log?.('viewer-join-begin',{roomId,muted});
  try {
    const latest = await bridge.getConfig();
    if (seq !== joinSeq) return;
    const res = await fetch(`${latest.server}/api/rooms/${encodeURIComponent(roomId)}/join`, {
      signal: AbortSignal.timeout(10000),
      method: 'POST',
      headers: { 'content-type': 'application/json', ...(latest.authToken ? { authorization: `Bearer ${latest.authToken}` } : {}) },
      body: JSON.stringify({ name: `${latest.displayName}（观看）`, password: password || undefined }),
    });
    const data = await res.json();
    if (seq !== joinSeq) return;
    if (!res.ok) {
      bridge.log?.('viewer-join-rejected',{status:res.status});
      if (res.status === 401 && password === undefined) askPassword({ roomId });
      else toast(data.error || '进入房间失败');
      return;
    }

    candidate = new LK.Room({ adaptiveStream: false });
    room = candidate;
    roomChat = window.QuickShareChat.mount($('roomChat'), candidate, LK.RoomEvent, roomId);
    candidate.on(LK.RoomEvent.TrackSubscribed, (track, pub, participant) => {
      if (room !== candidate || seq !== joinSeq) return;
      if (track.kind === LK.Track.Kind.Video) {
        pub.setVideoQuality?.(LK.VideoQuality.HIGH); // 锁定高清层，杜绝偶发降到低清
        addCell(track, participant);
      } else if (track.kind === LK.Track.Kind.Audio) addAudio(track);
    });
    candidate.on(LK.RoomEvent.TrackUnsubscribed, (track) => { if (room === candidate) { if (track.kind === LK.Track.Kind.Video) removeCell(track); else removeAudio(track); } });
    candidate.on(LK.RoomEvent.ParticipantConnected, () => { if (room === candidate) updateCount(); });
    candidate.on(LK.RoomEvent.ParticipantDisconnected, () => { if (room === candidate) updateCount(); });
    candidate.on(LK.RoomEvent.Disconnected, () => {
      if (room === candidate && seq === joinSeq) { toast('连接已断开'); leaveRoom(); }
    });
    await candidate.connect(data.url, data.token);
    if (seq !== joinSeq || room !== candidate) { await candidate.disconnect(); return; }
    roomChat?.refresh();
    applyAudioState();bridge.log?.('viewer-connected',{roomId,muted});

    currentRoom = roomId;
    $('title').textContent = `房间 ${roomId}`;
    $('list').style.display = 'none';
    $('watch').style.display = 'flex';
    $('backBtn').style.display = '';
    $('joinBox').style.display = 'none';
    $('refreshBtn').style.display = 'none';
    // 已在房间中的共享者
    for (const p of candidate.remoteParticipants.values()) {
      for (const pub of p.trackPublications.values()) {
        if (pub.videoTrack && pub.videoTrack.kind === LK.Track.Kind.Video) {
          pub.setVideoQuality?.(LK.VideoQuality.HIGH);
          addCell(pub.videoTrack, p);
        }
        if (pub.audioTrack) addAudio(pub.audioTrack);
      }
    }
    updateCount();
  } catch (err) {
    bridge.log?.('viewer-join-failed',{error:err.message});
    if (seq === joinSeq) {
      room = null;
      roomChat?.dispose();roomChat = null;
      clearAudio();
      $('grid').innerHTML = '';
      toast(`观看失败：${err.message || err}`);
    }
    try { await candidate?.disconnect(); } catch {}
  } finally {
    if (seq === joinSeq) joining = false;
  }
}

function addAudio(track) {
  if (audioTracks.has(track.sid)) return;
  const element = document.createElement('audio');
  element.autoplay = true;
  $('audioContainer').appendChild(element);
  track.attach(element);
  audioTracks.set(track.sid, {track, element});
  applyAudioState(); // LiveKit attach() overwrites element.muted; reapply after attachment.
  bridge.log?.('viewer-audio-attached',{sid:track.sid,muted});
  if(!muted)startPlayback();
}
function removeAudio(track) {
  const entry = audioTracks.get(track.sid);
  if (!entry) return;
  track.detach(entry.element); entry.element.srcObject = null; entry.element.remove();
  audioTracks.delete(track.sid);
  bridge.log?.('viewer-audio-detached',{sid:track.sid});
}
function clearAudio() { for (const {track} of audioTracks.values()) removeAudio(track); }
window.addEventListener('pagehide', () => { clearAudio(); room?.disconnect(); });
function addCell(track, participant) {
  if (document.getElementById(`cell-${track.sid}`)) return;
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.id = `cell-${track.sid}`;
  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.textContent = participant.identity?.startsWith('pub-') ? participant.name || participant.identity : participant.name || participant.identity;
  const video = document.createElement('video');
  video.autoplay = true; video.playsInline = true;
  const name = tag.textContent;
  video.addEventListener('resize', () => { tag.textContent = `${name} · ${video.videoWidth} × ${video.videoHeight}`; });
  cell.appendChild(video); cell.appendChild(tag);
  cell.onclick = () => cell.classList.toggle('enlarged');
  $('grid').appendChild(cell);
  track.attach(video);
}
function removeCell(track) {
  track.detach();
  document.getElementById(`cell-${track.sid}`)?.remove();
}
function updateCount() {
  const n = room ? room.remoteParticipants.size + 1 : 1;
  $('status').textContent = `${n} 人在房间`;
}

async function leaveRoom() {
  bridge.log?.('viewer-leave',{roomId:currentRoom,muted,tracks:audioTracks.size});
  ++joinSeq; ++listSeq;
  joining = false;
  const previous = room;
  room = null; currentRoom = null;
  roomChat?.dispose();roomChat = null;
  clearAudio();
  $('grid').innerHTML = '';
  $('watch').style.display = 'none';
  $('list').style.display = '';
  $('title').textContent = '房间列表';
  $('backBtn').style.display = 'none';
  $('joinBox').style.display = '';
  $('refreshBtn').style.display = '';
  loadRooms();
  try { await previous?.disconnect(); } catch {}
}

function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => (t.style.display = 'none'), 2600); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
})();
</script>
</body>
</html>
